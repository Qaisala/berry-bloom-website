<!DOCTYPE html>
<html>
  <head>
    <title>Specific Product</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style/specific.css" />
    <link rel="stylesheet" href="style/specific-header.css" />
    <script src="script/index.js"></script>
  </head>

  <body>
    <header>
      <div class="logo">
        <a href="index.html">
          <img src="img/Berry & Bloom-1.png" alt="Perfume Store Logo" />
        </a>
      </div>
      <nav class="nav-right">
        <ul>
          <li>
            <a href="track.html" class="button-like" id="button-track">
              Track your order</a
            >
          </li>

          <li class="dropdown">
            <a href="#" class="dropdown-toggle">Products</a>
            <ul class="dropdown-menu">
              <li>
                <a href="index.html#productswomen">Women's Perfume</a>
              </li>
              <li>
                <a href="index.html#productsmen">Men's Perfume</a>
              </li>
            </ul>
          </li>

          <li><a href="index.html#about">About Us</a></li>
          <li><a href="index.html#contact">Contact</a></li>
          <li>
            <a href="checkout.html"
              ><img src="./img/shopping-cart.png" class="cart-img" />
              <span id="cart-count">0</span></a
            >
          </li>
        </ul>
      </nav>
    </header>

    <main>
      <div id="specific-product"></div>

      <div id="cart-notification" class="cart-notification">
        <img
          id="notification-image"
          src=""
          alt="Added Item"
          style="
            width: 50px;
            height: 50px;
            vertical-align: middle;
            margin-right: 10px;
          "
        />
        Item added to your cart! <a href="checkout.html">View Cart</a>
      </div>
    </main>
    <div class="reviews-section">
      <h2 class="h2-header">Customer Reviews</h2>

      <div id="existing-reviews">
        <p>No reviews yet. Be the first to write one!</p>
      </div>

      <h2 class="h2-header">Write a Review</h2>
      <form id="review-form">
        <div class="form-group">
          <label for="rating">Rating:</label>
          <select id="rating" name="rating">
            <option value="5">★★★★★ (Excellent)</option>
            <option value="4">★★★★☆ (Good)</option>
            <option value="3">★★★☆☆ (Average)</option>
            <option value="2">★★☆☆☆ (Poor)</option>
            <option value="1">★☆☆☆☆ (Very Poor)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="comment">Your Review:</label>
          <textarea id="comment" name="comment" rows="5" required></textarea>
        </div>
        <div class="form-group">
          <label for="name">Your Name:</label>
          <input type="text" id="name" name="name" required />
        </div>
        <button type="submit">Submit Review</button>
      </form>
    </div>

    <footer>
      <p>&copy; 2025 Berry & Bloom. All rights reserved.</p>
      <script src="script/specific.js"></script>
      <script src="script/products.js"></script>
    </footer>
  </body>
</html>
