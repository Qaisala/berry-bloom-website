<!-- checkout.html  -->
<!DOCTYPE html>
<html>
  <head>
    <title>Checkout</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!-- Link CSS Files -->
    <link rel="stylesheet" href="style/checkout.css" />
    <link rel="stylesheet" href="style/checkout-header.css" />
  </head>

  <body>
    <!-- Header -->
    <div class="checkout-header">
      <div class="header-content">
        <div class="page-title checkout-header-left-section">
          <a href="index.html">
            <img class="logo" src="img/Berry & Bloom-1.png" />
          </a>
        </div>
        <div class="page-title checkout-header-middle-section">
          Secure checkout
        </div>
        <div class="page-title checkout-header-right-section">
          <img src="img/img icons/checkout-lock-icon.png" />
        </div>
      </div>
    </div>
 
    <!-- Main -->
    <div class="main">
      <div id="header2">
        <h2>Review your order</h2>
      </div>
      <!-- Container for "Order Summary" and "Payment Summary" -->
      <div class="checkout-grid">
        
        <!-- 1) Order Summary  -->
        <div class="order-summary">
          <h2 class="summary-payment-header">Order Summary</h2>
          <div id="orderItems"></div>
          <div class="summary-container">
            <div class="summary-item">
              <span>Subtotal:</span>
              <!-- <span id="subtotal">$0.00</span> -->
              <span id="subtotal"></span>
            </div>
            <div class="summary-item">
              <span>Shipping:</span>
              <!-- <span id="shipping">$0.00</span> -->
              <span id="shipping"></span>
            </div>
          </div>
          <div class="total">
            <span>Total:</span>
            <span id="total"></span>
          </div>
        </div>

        <!-- 2) Payment Summary -->
        <div class="payment-summary">
          <div class="payment-method">
            <h2 class="summary-payment-header">Payment Summary</h2>
            
            <form>
              <p>
                <label for="full-name">Full Name:</label>
                <input type="text" name="comp-name" id="full-name" />
              </p>
              <p>
                <label for="address">Address:</label>
                <textarea name="address" id="address"></textarea>
              </p>
              <p>
                <label for="phone-number">Phone Number:</label>
                <input type="text" name="phone" id="phone-number" />
              </p>
            </form>
            <label for="paymentType">Payment Method:</label>
            <select id="payment-method" name="paymentType">
              <option value="">Choose</option>
              <option value="cash-on-delivery">Cash On Delivery</option>
              <option value="credit-card">Credit Card</option>
            </select>
          </div>

          <div id="creditCardDetails" style="display: none">
            <form>
              <label for="cardNumber">Card Number:</label>
              <input
                type="text"
                id="cardNumber"
                placeholder="XXXX-XXXX-XXXX-XXXX"
              />
              <label for="expiryDate">Expiry Date:</label>
              <input type="text" id="expiryDate" placeholder="MM/YY" />
              <label for="cvv">CVV:</label>
              <input type="text" id="cvv" placeholder="XXX" />
              <p></p>
            </form>
          </div>
          <div id="cashDetails" style="display: none">
            <p>
              Kindly note that the delivery will take up to 3 days. Our courier
              will contact you once the order is ready.
            </p>
            <p>Please ensure you have the correct amount of cash ready.</p>
          </div>

          <div id="cart-actions">
            <button
              class="button-proceed-to-checkout"
              onclick="checkout()"
              id="proceed-checkout-btn"
              disabled
            >
              Proceed to checkout
            </button>
          </div>
        </div>
    <footer>
      <script src="script/index.js"></script>
      <script src="script/checkout.js"></script>
      <script src="script/products.js"></script>
    </footer>
  </body>
</html>
